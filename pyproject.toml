[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "release-version-cli"
version = "0.1.0"
description = "Safe GitHub release version bumper for Python and Node projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vivasvan Patel" }]
keywords = ["release", "version", "semver", "github", "changelog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.1",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
release-version = "release_version_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
